# ────────────────────────────────────────────────────────────────
# Cloudflare 部署配置（Workers 静态资源模式）
#
# 本项目是纯静态站点：没有 SSR、没有 Worker 脚本、没有数据库连接，
# 只是把构建产物 dist/ 作为静态资源上传。
#
# 说明：Workers 项目与 Pages 项目配置语法不同。
#   - Pages 项目用 `[build]` / `[[redirects]]`，部署命令是 pages deploy
#   - Workers 项目用 `name` + `[assets]`，部署命令是 wrangler deploy（当前采用）
# 如果把 Pages 的字段写在这里，wrangler deploy 会报
#   "Unexpected fields found in build field" 与
#   "Missing entry-point to Worker script or to assets directory"
# ────────────────────────────────────────────────────────────────

name = "warehouse-management-system-demo"
compatibility_date = "2025-01-01"

# 把构建产物当静态资源托管。
# single-page-application：未命中的路径自动回落到 index.html。
# 本项目用的是 hash 路由（#/login），深链路本就不会打到服务器，
# 这里设为 SPA 只是兜底，防止直接访问 /foo 时 404。
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
