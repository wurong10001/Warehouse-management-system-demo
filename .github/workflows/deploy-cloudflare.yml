name: Deploy to Cloudflare Workers

# 手动触发而不是 push 自动触发：
# 仓库没有配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 时，
# 自动触发会在每次提交后报红。
#
# 注意：这是可选方案。如果你已经在 Cloudflare 控制台用 Git 集成
# 连了这个仓库（Workers 预设），那 push 后 Cloudflare 会自己构建部署，
# 这个工作流无需启用。
on:
  workflow_dispatch:

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 接口层测试
        run: npm test

      - name: 端到端测试
        run: npm run test:e2e

  deploy:
    name: 构建并部署
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      # wrangler.toml 已声明 name 与 [assets]，此处不再传目录参数
      - name: 发布到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
