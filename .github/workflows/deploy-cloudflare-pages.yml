name: Deploy to Cloudflare Pages

# 手动触发（workflow_dispatch）而不是 push 自动触发：
# 仓库没有配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 这两个 secrets 时，
# 自动触发会在每次提交后报红。需要部署时手动运行即可。
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Cloudflare Pages 项目名'
        required: true
        default: 'wms-demo'

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 接口层测试
        run: npm test

      - name: 端到端测试
        run: npm run test:e2e

  deploy:
    name: 构建并部署
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 发布到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ inputs.project_name }}
